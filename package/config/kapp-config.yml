#@ load("@ytt:data", "data")

---
apiVersion: kapp.k14s.io/v1alpha1
kind: Config

minimumRequiredVersion: 0.50.0

#! Wait rules specify how to wait for resources that kapp does not wait for by default.
#! See more about the wait rules: https://carvel.dev/kapp/docs/latest/config/#waitrules.
waitRules:

- supportsObservedGeneration: false
  conditionMatchers:
  - type: Ready
    status: "True"
    success: true
  resourceMatchers:
  - apiVersionKindMatcher: {apiVersion: cert-manager.io/v1, kind: Certificate}
  - apiVersionKindMatcher: {apiVersion: cert-manager.io/v1, kind: Issuer}

#! Rebase rules specify how to merge the resources in the cluster with the ones being applied.
#! See more: https://carvel.dev/kapp/docs/latest/config/#rebaserules
rebaseRules:

#! Load balancer implementations can add their own annotations to the Envoy Service, which kapp
#! would remove on the next update. Keep the annotations that are in the cluster but were never
#! applied by the package (according to the last applied resource stored by kapp), so that the
#! annotations set via the package values can still be changed and removed.
- ytt:
    overlayContractV1:
      overlay.yml: |
        #@ load("@ytt:data", "data")
        #@ load("@ytt:json", "json")
        #@ load("@ytt:overlay", "overlay")
        #@ load("@ytt:struct", "struct")
        #@ existing = struct.decode(data.values.existing)["metadata"].get("annotations") or {}
        #@ new = struct.decode(data.values.new)["metadata"].get("annotations") or {}
        #@ original = existing.get("kapp.k14s.io/original")
        #@ applied = (json.decode(original)["metadata"].get("annotations") or {}) if original else {}
        #@overlay/match by=overlay.all
        ---
        metadata:
          #@overlay/match missing_ok=True
          annotations:
            #@ for k in existing:
            #@   if k not in applied and k not in new and not k.startswith("kapp.k14s.io/"):
            #@overlay/match missing_ok=True
            #@yaml/text-templated-strings
            (@= k @): #@ existing[k]
            #@   end
            #@ end
  resourceMatchers:
  - kindNamespaceNameMatcher:
      kind: Service
      namespace: #@ data.values.namespace
      name: envoy

#! Bind change groups to resources matched by resource matchers.
#! See more: https://carvel.dev/kapp/docs/latest/config/#changegroupbindings
changeGroupBindings:

- name: change-groups.kapp.k14s.io/envoy-daemonset
  resourceMatchers:
  - kindNamespaceNameMatcher:
      kind: DaemonSet
      namespace: #@ data.values.namespace
      name: envoy

- name: change-groups.kapp.k14s.io/envoy-deployment
  resourceMatchers:
  - kindNamespaceNameMatcher:
      kind: Deployment
      namespace: #@ data.values.namespace
      name: envoy

#! Bind change rules to resources matched by resource matchers.
#! See more: https://carvel.dev/kapp/docs/latest/config/#changerulebindings
changeRuleBindings:

#! Ensure zero-downtime when switching the Envoy workload
#! from a DaemonSet to Deployment.
- rules:
  - "upsert before deleting change-groups.kapp.k14s.io/envoy-daemonset"
  resourceMatchers:
  - kindNamespaceNameMatcher:
      kind: Deployment
      namespace: #@ data.values.namespace
      name: envoy

#! Ensure zero-downtime when switching the Envoy workload
#! from a Deployment to DaemonSet.
- rules:
  - "upsert before deleting change-groups.kapp.k14s.io/envoy-deployment"
  resourceMatchers:
  - kindNamespaceNameMatcher:
      kind: DaemonSet
      namespace: #@ data.values.namespace
      name: envoy
