#@data/values-schema
#@schema/validation ("`gateway.domain` and `gateway.tls.issuer` to be set together", gateway_tls_complete), ("`tls.internal.renew_before` to be shorter than `tls.internal.duration`", renewal_before_expiry), ("`envoy.host_ports.enabled` to be used with `envoy.kind: DaemonSet`", host_ports_on_daemonset)
---

#@schema/desc "The namespace in which to deploy Contour and Envoy."
#@schema/validation ("a valid DNS label", is_dns_name), min_len=1, max_len=63
namespace: projectcontour

#! =============================================
#! Gateway
#! =============================================

#@schema/desc "The default Gateway that Contour serves via the Kubernetes Gateway API. HTTPProxy and Ingress resources keep working alongside the routes attached to it. See https://projectcontour.io/docs/latest/config/gateway-api."
gateway:
  #@schema/desc "Whether to create the `contour` GatewayClass and the default Gateway, and configure Contour to serve it."
  enabled: true
  #@schema/desc "Whether to install the CRDs from the experimental channel of the Gateway API, required by the Gateway. Set it to `false` if the Gateway API CRDs are already managed by something else in the cluster."
  install_crds: true
  #@schema/desc "The name of the Gateway, created in the package namespace."
  #@schema/validation ("a valid DNS name", is_dns_name), min_len=1
  name: contour
  #@schema/desc "The namespaces from which routes can attach to the Gateway. `All` allows any namespace, `Same` only the package namespace."
  #@schema/validation one_of=["All", "Same"]
  allowed_routes: All
  #@schema/desc "The domain served over HTTPS by the Gateway via a wildcard certificate (`*.<domain>`). It requires `tls.issuer`."
  #@schema/examples ("Custom domain", "example.com"), ("Local development with sslip.io", "127.0.0.1.sslip.io")
  #@schema/validation ("a valid DNS name", lambda v: v == "" or is_dns_name(v))
  domain: ""
  #@schema/desc "Settings for the HTTPS listener of the Gateway."
  tls:
    #@schema/desc "The name of the cert-manager ClusterIssuer that issues the wildcard certificate for `domain`. For ACME issuers, wildcard certificates require a DNS-01 challenge."
    #@schema/examples ("Kadras private CA", "kadras-ca-issuer")
    issuer: ""
    #@schema/desc "Whether to redirect HTTP requests for `*.<domain>` to HTTPS."
    http_redirect: true

#! =============================================
#! Components
#! =============================================

#@schema/desc "Settings for Contour, the control plane."
contour:
  #@schema/desc "The number of Contour replicas. Additional replicas are standby via leader election. With more than 1 replica, a PodDisruptionBudget is created."
  #@schema/validation min=1
  replicas: 2
  #@schema/desc "Contour configuration, merged on top of the one computed by the package. See https://projectcontour.io/docs/latest/configuration/#configuration-file."
  #@schema/type any=True
  config: {}

#@schema/desc "Settings for Envoy, the data plane."
envoy:
  #@schema/desc "The Kubernetes workload Envoy runs as."
  #@schema/validation one_of=["Deployment", "DaemonSet"]
  kind: Deployment
  #@schema/desc "The number of Envoy replicas when `kind` is `Deployment`. With more than 1 replica, a PodDisruptionBudget is created."
  #@schema/validation min=1, when=lambda _, ctx: ctx.parent["kind"] == "Deployment"
  replicas: 2
  #@schema/desc "How long to wait, in seconds, for Envoy to drain open connections before terminating."
  #@schema/validation min=30
  termination_grace_period_seconds: 300
  #@schema/desc "Settings for the Service exposing Envoy."
  service:
    #@schema/desc "The type of the Service."
    #@schema/validation one_of=["LoadBalancer", "NodePort", "ClusterIP"]
    type: LoadBalancer
    #@schema/desc "The external traffic policy of the Service, when `type` is `LoadBalancer` or `NodePort`. `Local` preserves the client source IP."
    #@schema/validation one_of=["Cluster", "Local"]
    external_traffic_policy: Local
    #@schema/desc "Annotations for the Service, for example to configure the load balancer implementation."
    #@schema/type any=True
    annotations: {}
    #@schema/desc "The node ports of the Service, when `type` is `LoadBalancer` or `NodePort`. If 0, Kubernetes assigns one."
    node_ports:
      #@schema/desc "The node port for HTTP traffic."
      #@schema/validation min=0, max=65535
      http: 0
      #@schema/desc "The node port for HTTPS traffic."
      #@schema/validation min=0, max=65535
      https: 0
  #@schema/desc "Settings for exposing Envoy directly on the ports of the nodes it runs on. Requires `kind: DaemonSet`, since only one Envoy can bind the ports on each node. Typically used for local clusters."
  host_ports:
    #@schema/desc "Whether to expose Envoy on host ports."
    enabled: false
    #@schema/desc "The host port for HTTP traffic."
    #@schema/validation min=1, max=65535
    http: 80
    #@schema/desc "The host port for HTTPS traffic."
    #@schema/validation min=1, max=65535
    https: 443
  #@schema/desc "Whether Envoy expects the PROXY protocol on all its listeners, as sent by some load balancers to preserve the client source IP."
  proxy_protocol: false

#! =============================================
#! TLS
#! =============================================

#@schema/desc "Settings for TLS. Envoy listeners only accept TLS 1.3 connections. To allow TLS 1.2, set `tls.minimum-protocol-version` in `contour.config`."
tls:
  #@schema/desc "The certificates securing the connection between Contour and Envoy."
  internal:
    #@schema/desc "How the certificates are provisioned. `certgen` generates them with a Job at every installation and upgrade, and doesn't renew them in between. `cert-manager` issues and renews them via cert-manager, which must be installed in the cluster."
    #@schema/validation one_of=["certgen", "cert-manager"]
    provider: certgen
    #@schema/desc "How long the certificates are valid, in hours."
    #@schema/validation ("a number of hours, like `8760h`", is_hours)
    duration: 8760h
    #@schema/desc "How long before expiry the certificates are renewed, in hours. Only for the `cert-manager` provider."
    #@schema/validation ("a number of hours, like `360h`", is_hours)
    renew_before: 360h

#! =============================================
#! Observability
#! =============================================

#@schema/desc "Settings for logs, metrics, and traces."
observability:
  logging:
    #@schema/desc "The log level for Contour and Envoy. Contour only distinguishes between `debug` and the rest."
    #@schema/validation one_of=["debug", "info", "warn", "error"]
    level: info
    #@schema/desc "The format of the Contour logs and of the Envoy access logs."
    #@schema/validation one_of=["text", "json"]
    format: text
  metrics:
    #@schema/desc "Whether to annotate the Contour and Envoy Pods for Prometheus scraping."
    enabled: true
  tracing:
    #@schema/desc "Whether to export traces from Envoy."
    enabled: false
    #@schema/desc "The OTLP/gRPC endpoint of an in-cluster OpenTelemetry collector, in the form `[http://]<service>.<namespace>[.svc[.cluster.local]]:<port>`."
    #@schema/examples ("OpenTelemetry collector", "http://otel-collector.observability.svc:4317")
    #@schema/validation ("an in-cluster OTLP/gRPC endpoint like `http://<service>.<namespace>.svc:4317`", is_in_cluster_otlp_endpoint), when=lambda _, ctx: ctx.parent["enabled"]
    endpoint: ""
    #@schema/desc "The fraction of requests to trace, from 0 (never) to 1 (always)."
    #@schema/validation min=0.0, max=1.0
    sampling_rate: 1.0

