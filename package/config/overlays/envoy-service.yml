#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")

#@ service = data.values.envoy.service
#@ external = service.type in ["LoadBalancer", "NodePort"]

#@overlay/match by=overlay.subset({"kind":"Service", "metadata":{"name":"envoy"}})
---
metadata:
  #! Replaces the upstream annotations, which are specific to AWS.
  #@overlay/replace
  annotations: #@ service.annotations
spec:
  type: #@ service.type

  ports:
  #@overlay/match by=overlay.subset({"name":"http"})
  -
    #@ if/end external and service.node_ports.http:
    #@overlay/match missing_ok=True
    nodePort: #@ service.node_ports.http
    targetPort: http
  #@overlay/match by=overlay.subset({"name":"https"})
  -
    #@ if/end external and service.node_ports.https:
    #@overlay/match missing_ok=True
    nodePort: #@ service.node_ports.https
    targetPort: https

  #! Kubernetes rejects an external traffic policy on ClusterIP Services.
  #@ if external:
  externalTrafficPolicy: #@ service.external_traffic_policy
  #@ else:
  #@overlay/remove
  externalTrafficPolicy:
  #@ end
