#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")

#@ if data.values.envoy.kind == "Deployment":

#@overlay/match by=overlay.subset({"kind":"DaemonSet", "metadata":{"name":"envoy"}})
#@overlay/remove
---

#@overlay/match by=overlay.subset({"kind":"Deployment", "metadata":{"name":"envoy"}})
---
spec:
  replicas: #@ data.values.envoy.replicas
  template:
    spec:
      containers:
      #@overlay/match by="name"
      - name: envoy
        args:
        #@overlay/match by=overlay.subset("--log-level info")
        - #@ "--log-level " + data.values.observability.logging.level

#@ end
