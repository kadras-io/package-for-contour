#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")

#! Envoy listens on 8080 (HTTP) and 8443 (HTTPS), also when serving a Gateway,
#! since Contour maps the Gateway listener ports 80 and 443 to those container ports.

#@ daemonset = overlay.subset({"kind":"DaemonSet", "metadata":{"name":"envoy"}})
#@ deployment = overlay.subset({"kind":"Deployment", "metadata":{"name":"envoy"}})

#@overlay/match by=overlay.or_op(daemonset, deployment)
---
spec:
  template:
    spec:
      containers:
      #@overlay/match by="name"
      - name: envoy
        ports:
        #@overlay/match by=overlay.subset({"name":"http"})
        -
          #@ if data.values.envoy.host_ports.enabled:
          hostPort: #@ data.values.envoy.host_ports.http
          #@ else:
          #@overlay/remove
          hostPort:
          #@ end
        #@overlay/match by=overlay.subset({"name":"https"})
        -
          #@ if data.values.envoy.host_ports.enabled:
          hostPort: #@ data.values.envoy.host_ports.https
          #@ else:
          #@overlay/remove
          hostPort:
          #@ end
