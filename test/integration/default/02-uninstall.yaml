---
# The package is deleted with kapp, as kapp-controller does when deleting the PackageInstall:
# `kctrl dev --delete` doesn't delete the resources of a local installation.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      kapp delete -a kuard -y
      kapp delete -a contour.app -n tests -y
