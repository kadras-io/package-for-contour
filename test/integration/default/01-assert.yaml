---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - script: |
      kubectl wait --for=condition=Accepted gateway/contour -n projectcontour --timeout=60s && \
      curl --fail-with-body -H "Host: ingress.kuard.local" localhost:80 && \
      curl --fail-with-body -H "Host: httpproxy.kuard.local" localhost:80 && \
      curl --fail-with-body -H "Host: gateway.kuard.local" localhost:80
