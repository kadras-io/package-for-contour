# Envoy runs as a DaemonSet listening on the host ports, behind a ClusterIP Service.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: envoy
  namespace: projectcontour
spec:
  template:
    spec:
      (containers[?name == 'envoy'] | [0]):
        (ports[?name == 'http'] | [0]):
          containerPort: 8080
          hostPort: 80
        (ports[?name == 'https'] | [0]):
          containerPort: 8443
          hostPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: projectcontour
spec:
  type: ClusterIP
  (externalTrafficPolicy): null
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contour
  namespace: projectcontour
spec:
  replicas: 1
---
# Host ports are only allowed by the privileged Pod Security Standard.
apiVersion: v1
kind: Namespace
metadata:
  name: projectcontour
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: envoy
  namespace: projectcontour
spec:
  template:
    spec:
      automountServiceAccountToken: false
