apiVersion: v1
kind: Namespace
metadata:
  name: ingress
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: contour
  namespace: ingress
data:
  (parse_yaml("contour.yaml")):
    tls:
      minimum-protocol-version: "1.2"
    disablePermitInsecure: true
    gateway:
      gatewayRef:
        namespace: ingress
