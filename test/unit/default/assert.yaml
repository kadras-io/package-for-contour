# Envoy runs as a Deployment with 2 replicas, without host ports, annotated for Prometheus.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: projectcontour
spec:
  replicas: 2
  template:
    metadata:
      annotations:
        prometheus.io/port: "8002"
        prometheus.io/path: /stats/prometheus
    spec:
      terminationGracePeriodSeconds: 300
      (containers[?name == 'envoy'] | [0]):
        (length(ports[?hostPort])): 0
        (contains(args, '--log-level info')): true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contour
  namespace: projectcontour
spec:
  replicas: 2
  template:
    metadata:
      annotations:
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
---
# High availability.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: contour
  namespace: projectcontour
spec:
  minAvailable: 1
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envoy
  namespace: projectcontour
spec:
  minAvailable: 1
---
# Envoy is exposed via a LoadBalancer Service, without the upstream AWS annotations.
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: projectcontour
  (length(annotations)): 0
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
---
# The internal certificates are generated by certgen.
apiVersion: batch/v1
kind: Job
metadata:
  namespace: projectcontour
spec:
  template:
    spec:
      (containers[?name == 'contour'] | [0]):
        (contains(command, '--certificate-lifetime=365')): true
---
# Gateway API: experimental CRDs, GatewayClass, and a Gateway serving HTTPProxy and Ingress.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gateways.gateway.networking.k8s.io
  annotations:
    gateway.networking.k8s.io/bundle-version: v1.3.0
    gateway.networking.k8s.io/channel: experimental
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: contour
spec:
  controllerName: projectcontour.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: contour
  namespace: projectcontour
spec:
  gatewayClassName: contour
  (listeners[*].name): [http, contour-https]
  (listeners[?name == 'http'] | [0]):
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  (listeners[?name == 'contour-https'] | [0]):
    port: 443
    protocol: projectcontour.io/https
---
# The IngressClass is the cluster default.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: contour
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: projectcontour.io/contour
---
# Contour configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: contour
  namespace: projectcontour
data:
  (parse_yaml("contour.yaml")):
    tls:
      minimum-protocol-version: "1.3"
    accesslog-format: envoy
    gateway:
      gatewayRef:
        namespace: projectcontour
        name: contour
    (tracing): null
---
# Contour reads its configuration only at startup, so kapp versions the ConfigMap to roll out changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: contour
  namespace: projectcontour
  annotations:
    kapp.k14s.io/versioned: ""
---
# The workloads comply with the restricted Pod Security Standard, which is enforced on the namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: projectcontour
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: projectcontour
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      (initContainers[*].securityContext.allowPrivilegeEscalation): [false]
      (containers[*].securityContext.allowPrivilegeEscalation): [false, false]
      (containers[*].securityContext.capabilities.drop): [[ALL], [ALL]]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contour
  namespace: projectcontour
spec:
  template:
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      (containers[*].securityContext.capabilities.drop): [[ALL]]
---
apiVersion: batch/v1
kind: Job
spec:
  template:
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      (containers[*].securityContext.capabilities.drop): [[ALL]]
---
# The service account token is only mounted explicitly, where the Kubernetes API is accessed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contour
  namespace: projectcontour
spec:
  template:
    spec:
      automountServiceAccountToken: false
      (volumes[?name == 'kube-api-access'] | [0].projected.sources[*].keys(@)[0]): [serviceAccountToken, configMap, downwardAPI]
      (containers[?name == 'contour'] | [0].volumeMounts[?name == 'kube-api-access'] | [0]):
        mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        readOnly: true
---
apiVersion: batch/v1
kind: Job
spec:
  template:
    spec:
      automountServiceAccountToken: false
      (containers[0].volumeMounts[?name == 'kube-api-access'] | [0]):
        mountPath: /var/run/secrets/kubernetes.io/serviceaccount
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: projectcontour
spec:
  template:
    spec:
      automountServiceAccountToken: false
      (length(volumes[?name == 'kube-api-access'])): 0
