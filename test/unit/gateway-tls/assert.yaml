apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: projectcontour
spec:
  (listeners[*].name): [http, contour-https, https, http-redirect]
  (listeners[*].allowedRoutes.namespaces.from): [Same, Same, Same, Same]
  (listeners[?name == 'https'] | [0]):
    port: 443
    protocol: HTTPS
    hostname: '*.kadras.io'
    tls:
      mode: Terminate
      certificateRefs:
        - kind: Secret
          name: platform-tls
  (listeners[?name == 'http-redirect'] | [0]):
    port: 80
    protocol: HTTP
    hostname: '*.kadras.io'
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-tls
  namespace: projectcontour
spec:
  secretName: platform-tls
  dnsNames:
    - '*.kadras.io'
  issuerRef:
    name: kadras-ca-issuer
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-https-redirect
  namespace: projectcontour
spec:
  parentRefs:
    - name: platform
      sectionName: http-redirect
  hostnames:
    - '*.kadras.io'
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: contour
  namespace: projectcontour
data:
  (parse_yaml("contour.yaml")):
    gateway:
      gatewayRef:
        name: platform
