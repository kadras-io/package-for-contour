apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: projectcontour
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.10
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  (ports[?name == 'http'] | [0]):
    nodePort: 30080
  (ports[?name == 'https'] | [0]):
    nodePort: 30443
